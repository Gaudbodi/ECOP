<html>
<head>
  <title>Rain Animation</title>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body {
  margin: 0;
  overflow: hidden;
  background: #2c3e50; /* Dark background for contrast */
}

.rain-container {
  position: relative;
  width: 100vw;
  height: 100vh;
}

.raindrop {
  position: absolute;
  top: -50px; /* Start above the screen */
  width: 2px;
  height: 20px;
  background: #3498db; /* Light blue raindrop */
  opacity: 0.7;
  border-radius: 2px;
}

</style>

</head>

<body>
<div class="rain-container">
  <!-- Raindrops -->
  <div class="raindrop"></div>
  <div class="raindrop"></div>
  <div class="raindrop"></div>
  <div class="raindrop"></div>
  <div class="raindrop"></div>
</div>

<script>

    // Generate multiple raindrops
const totalRaindrops = 50; // Adjust for more or fewer raindrops
const container = document.querySelector('.rain-container');

for (let i = 0; i < totalRaindrops; i++) {
  const drop = document.createElement('div');
  drop.classList.add('raindrop');
  container.appendChild(drop);

  // Randomize starting position and animation
  gsap.fromTo(
    drop,
    {
      x: Math.random() * window.innerWidth, // Random horizontal position
      y: -50, // Start above the screen
    },
    {
      y: window.innerHeight + 50, // Fall below the screen
      duration: Math.random() * 2 + 1, // Random fall speed
      repeat: -1, // Infinite loop
      delay: Math.random() * 2, // Staggered start
      ease: 'power1.in', // Smooth falling effect
    }
  );
}

    </script>
</body>
</html>
