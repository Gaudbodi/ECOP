<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ghana CAP Platform</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Animated, abstract glassmorphism backdrop — sits behind .login-card.
           Pure CSS: only transform/opacity are animated for GPU compositing.
           The card's backdrop-filter blur diffuses these blobs, preserving legibility. */
        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .login-bg::before,
        .login-bg::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(48px);
            will-change: transform, opacity;
        }

        /* Cyan blob, top-left drift */
        .login-bg::before {
            width: 48vmax;
            height: 48vmax;
            top: -12vmax;
            left: -8vmax;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.42) 0%, rgba(56, 189, 248, 0) 68%);
            animation: blobDriftA 16s ease-in-out infinite alternate;
        }

        /* Indigo blob, bottom-right drift */
        .login-bg::after {
            width: 52vmax;
            height: 52vmax;
            bottom: -14vmax;
            right: -10vmax;
            background: radial-gradient(circle at center, rgba(129, 140, 248, 0.38) 0%, rgba(139, 92, 246, 0) 68%);
            animation: blobDriftB 19s ease-in-out infinite alternate;
        }

        /* A third, slower violet band for depth */
        .login-bg-extra {
            position: absolute;
            top: 22%;
            left: 30%;
            width: 42vmax;
            height: 42vmax;
            border-radius: 50%;
            filter: blur(56px);
            background: radial-gradient(circle at center, rgba(168, 85, 247, 0.30) 0%, rgba(139, 92, 246, 0) 68%);
            will-change: transform, opacity;
            animation: blobDriftC 13s ease-in-out infinite alternate;
        }

        @keyframes blobDriftA {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.65; }
            100% { transform: translate(16vmax, 12vmax) scale(1.35); opacity: 1; }
        }

        @keyframes blobDriftB {
            0%   { transform: translate(0, 0) scale(1.2); opacity: 0.7; }
            100% { transform: translate(-15vmax, -11vmax) scale(0.85); opacity: 1; }
        }

        @keyframes blobDriftC {
            0%   { transform: translate(-10vmax, 7vmax) scale(0.9); opacity: 0.55; }
            100% { transform: translate(12vmax, -9vmax) scale(1.25); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-bg::before,
            .login-bg::after,
            .login-bg-extra {
                animation: none;
            }
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .error {
            color: #ef4444;
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-bg" aria-hidden="true">
        <div class="login-bg-extra"></div>
    </div>
    <div class="login-card">
        <h1>Ghana CAP Portal</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if step == '1' %}
            <input type="hidden" name="step" value="1">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="name@example.com">
            </div>
            <button type="submit">Send Verification Code</button>
            {% else %}
            <input type="hidden" name="step" value="2">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="error" style="color: #38bdf8; border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 0.5rem; border-radius: 0.5rem;">
                A code has been sent (check your phone or email).
            </div>
            <div class="form-group">
                <label>Verification Code</label>
                <input type="text" name="code" required placeholder="123456" maxlength="6">
            </div>
            <button type="submit">Verify & Login</button>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="/login" style="color: #94a3b8; font-size: 0.875rem; text-decoration: none;">Change Email</a>
            </div>
            {% endif %}
        </form>
    </div>
</body>
</html>
